<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Truck Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  </head>
  <body>
    <!--
      Kata 9: Bootstrap. Work in THIS file. Add Bootstrap classes, save, and check the kata page.
      Don't change or delete any id="...": the checker uses them to find things.
      Change the words to YOUR truck if you like.
    -->

    <!-- ========== Drill A + B: the top of the page ========== -->
    <!-- Example: this section is already done. -->
    <p id="example" class="text-center text-success fw-bold mb-0 py-2">Open today until 9 pm!</p>

    <!-- Drill B Rep 1: dark background, white text, and space above and below (py-5). -->
    <section id="hero">
      <div class="container">
        <!-- Drill A Rep 1: big and centered (display-4, text-center). -->
        <h1 id="truck-name">Taco Rocket</h1>

        <!-- Drill A Rep 2: the "lead" class makes a paragraph stand out. -->
        <p id="tagline">Tacos that are out of this world.</p>

        <!-- Drill B Rep 2: a yellow badge (badge bg-warning). -->
        <span id="special">Taco Tuesday</span>

        <!-- Drill A Rep 3: a big yellow button (btn, btn-warning, btn-lg). -->
        <button id="order-btn">Order now</button>
      </div>
    </section>

    <main class="container py-4">
      <!-- ========== Drill C: flex ========== -->
      <!-- Drill C Rep 1: put these side by side with a gap (d-flex, gap-3). -->
      <div id="contact">
        <span>📍 Main St</span>
        <span>📞 555-0123</span>
        <span>📷 @tacorocket</span>
      </div>

      <!-- Drill C Rep 2: stacked on a phone, side by side on a laptop (d-flex, flex-column, flex-md-row). -->
      <h2 class="mt-4">How to order</h2>
      <div id="steps">
        <p class="p-3 bg-light flex-fill">1. Pick your tacos</p>
        <p class="p-3 bg-light flex-fill">2. Pay at the window</p>
        <p class="p-3 bg-light flex-fill">3. Eat!</p>
      </div>

      <!-- ========== Drill D: grid and cards ========== -->
      <h2 class="mt-4">Menu</h2>
      <!-- Drill D Rep 1: make this a row, with space between the columns (row, g-3). -->
      <div id="menu-grid">
        <!-- Example column: already done. Full width on a phone, 1/3 on a laptop. -->
        <div class="col-12 col-md-4">
          <div class="card">
            <div class="card-body">
              <h3 class="card-title h5">Taco</h3>
              <p class="card-text">$4.50</p>
            </div>
          </div>
        </div>

        <!-- Drill D Rep 2: make these two columns like the example (col-12 col-md-4). -->
        <!-- Drill D Rep 3: then make what's inside each one a card like the example
             (card, card-body, card-title). -->
        <div>
          <div>
            <div>
              <h3>Burrito</h3>
              <p>$9.00</p>
            </div>
          </div>
        </div>

        <div>
          <div>
            <div>
              <h3>Churro</h3>
              <p>$3.00</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
